name: Tests Node.js

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar sintaxis de la auditoría
        run: node --check scripts/auditar-integracion-e2e.js
      - name: Ejecutar pruebas unitarias
        run: node --test
